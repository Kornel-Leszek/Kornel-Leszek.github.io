<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Podpowiedź: Hmmm... fragm3nty k0du musz9 być 8dzieś ukryt3...</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">
        <h1>Wprowadź kod</h1>

        <p>Proszę wprowadzić kod poniżej.</p>

        <form id="codeForm">
            <input
                type="text"
                id="codeInput"
                placeholder="Wpisz znaleziony kod..."
                autocomplete="off"
            >

            <button type="submit">Sprawdź</button>
        </form>

        <p id="message"></p>
    </div>

    <script>
        const poprawnyKod = "WPISZ_TUTAJ_KOD";

        document.getElementById("codeForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const wpisanyKod = document.getElementById("codeInput").value.trim();
            const message = document.getElementById("message");

            if (wpisanyKod === poprawnyKod) {
                message.textContent = "Kod poprawny! Przechodzisz dalej...";
                message.style.color = "#66dd88";

                setTimeout(function() {
                    window.location.href = "kolejna_strona.html";
                }, 1500);

            } else {
                message.textContent = "Niepoprawny kod. Szukaj dalej...";
                message.style.color = "#dd6666";
            }
        });
    </script>

</body>
</html>
