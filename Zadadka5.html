<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podpowiedź: Nauka to straszna ciemnota...</title>

    <link rel="stylesheet" href="Zagadka5.css">
</head>

<body>

    <div class="container">

        <h1>Rozwiąż działanie:</h1>

        <h2>2 + 2 = ?</h2>

        <!-- UKRYTA PODPOWIEDŹ -->

        <div id="secret" hidden>

            <p>Twórca tej strony nie zdał matmy i poprawną odpowiedzią jest...</p>

            <h1 class="answer">8462</h1>

        </div>


        <!-- FORMULARZ ZAWSZE WIDOCZNY -->

        <form id="answerForm">

            <input
                type="text"
                id="answerInput"
                placeholder="Wpisz odpowiedź..."
                autocomplete="off"
                inputmode="numeric"
                maxlength="4"
                required
            >

            <button type="submit">Sprawdź</button>

        </form>

        <p id="message"></p>

        <a href="Gratulacje.html" id="nextLink" hidden>
            Przejdź dalej
        </a>

    </div>


    <script>

        // PRZEŁĄCZANIE TRYBU I ODKRYWANIE PODPOWIEDZI

        const secret = document.getElementById("secret");

        document.addEventListener("keydown", function(event) {

            if (
                event.code === "KeyL" &&
                !event.repeat &&
                event.target.tagName !== "INPUT"
            ) {

                document.body.classList.toggle("dark");

                secret.hidden =
                    !document.body.classList.contains("dark");

            }

        });


        // SPRAWDZANIE ODPOWIEDZI

        document.getElementById("answerForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const answer = document.getElementById("answerInput").value.trim();

            const message = document.getElementById("message");

            const nextLink = document.getElementById("nextLink");


            if (answer === "8462") {

                message.textContent = "Brawo! Twórca jest z ciebie dumny.";

                message.style.color = "#66dd88";

                nextLink.hidden = false;

            } else {

                message.textContent = "Niepoprawna odpowiedź!";

                message.style.color = "#dd6666";

                nextLink.hidden = true;

            }

        });

    </script>

</body>
</html>
