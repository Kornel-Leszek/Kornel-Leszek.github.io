<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>System oceniania uczniów</title>
</head>
<body>

<script>
    class Uczen {
        constructor(imie) {
            this._imie = imie;
            this._oceny = [];
        }

        get imie() {
            return this._imie;
        }

        set imie(noweImie) {
            this._imie = noweImie;
        }

        get oceny() {
            return [...this._oceny];
        }

        set oceny(noweOceny) {
            this._oceny = [...noweOceny];
        }

        dodajOceny(...noweOceny) {
            this._oceny.push(...noweOceny);
        }

        obliczSrednia() {
            if (this._oceny.length === 0) {
                return 0;
            }

            const suma = this._oceny.reduce(
                (suma, ocena) => suma + ocena, 0
            );

            return suma / this._oceny.length;
        }
    }

    const uczen = new Uczen("Jan");

    uczen.dodajOceny(5, 4, 3, 5);

    console.log("Uczeń: " + uczen.imie);
    console.log("Oceny: " + uczen.oceny);
    console.log("Średnia: " + uczen.obliczSrednia());
</script>

</body>
</html>
