<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gratulacje!</title>

    <link rel="stylesheet" href="Gratulacje.css">
</head>

<body>

    <div class="container">

        <h1>Gratulacje!</h1>

        <p class="description">
            Udało Ci się rozwiązać wszystkie zagadki!
        </p>

        <p>
            Zanim odbierzesz swoją nagrodę, wpisz nazwę,
            pod którą chcesz zostać zapamiętany.
        </p>

        <form id="nameForm">
            <input
                type="text"
                id="nameInput"
                placeholder="Wpisz swoją nazwę..."
                autocomplete="off"
                required
            >

            <button type="submit">Zatwierdź</button>
        </form>

        <div id="result" hidden>

            <h2 id="greeting"></h2>

            <p>
                Dziękuję za poświęcony czas i przejście
                wszystkich zagadek!
            </p>

            <p>
                A teraz możesz odebrać swoją nagrodę:
            </p>

            <a
                href="https://youtu.be/zL19uMsnpSU?si=riBhNMPHG-wA_IgL"
                target="_blank"
                rel="noopener noreferrer"
                class="reward"
            >
                🎁 Odbierz nagrodę
            </a>

        </div>

    </div>

    <script>
        const form = document.getElementById("nameForm");
        const input = document.getElementById("nameInput");

        const result = document.getElementById("result");
        const greeting = document.getElementById("greeting");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const nazwa = input.value.trim();

            if (nazwa === "") {
                return;
            }

            greeting.textContent = "Brawo, " + nazwa + "!";

            result.hidden = false;

            form.hidden = true;
        });
    </script>

</body>
</html>
