<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gratulacje!</title>

    <link rel="stylesheet" href="Gratulacje.css">
</head>

<body>

    <div class="container">

        <h1>Gratulacje!</h1>

        <p class="description">
            Udało Ci się rozwiązać wszystkie zagadki!
        </p>

        <p>
            Zanim odbierzesz swoją nagrodę, wpisz nazwę,
            pod którą chcesz zostać zapamiętany.
        </p>

        <form id="nameForm">
            <input
                type="text"
                id="nameInput"
                placeholder="Wpisz swoją nazwę..."
                autocomplete="off"
                maxlength="30"
                required
            >

            <button type="submit" id="submitButton">
                Zatwierdź
            </button>
        </form>

        <p id="status"></p>

        <div id="result" hidden>

            <h2 id="greeting"></h2>

            <p>
                Dziękuję za poświęcony czas i przejście
                wszystkich zagadek!
            </p>

            <p>
                A teraz możesz odebrać swoją nagrodę:
            </p>

            <a
                href="https://youtu.be/zL19uMsnpSU?si=riBhNMPHG-wA_IgL"
                target="_blank"
                rel="noopener noreferrer"
                class="reward"
            >
                🎁 Odbierz nagrodę
            </a>

        </div>

    </div>

    <!-- Biblioteka Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        // DANE TWOJEGO PROJEKTU SUPABASE

        const SUPABASE_URL = "TUTAJ_WKLEJ_PROJECT_URL";
        const SUPABASE_PUBLISHABLE_KEY = "TUTAJ_WKLEJ_PUBLISHABLE_KEY";

        const db = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        // Elementy strony

        const form = document.getElementById("nameForm");
        const input = document.getElementById("nameInput");

        const result = document.getElementById("result");
        const greeting = document.getElementById("greeting");

        const status = document.getElementById("status");
        const submitButton = document.getElementById("submitButton");

        // Zapisywanie uczestnika

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const nazwa = input.value.trim();

            if (nazwa.length < 1 || nazwa.length > 30) {
                status.textContent = "Nazwa musi mieć od 1 do 30 znaków.";
                return;
            }

            submitButton.disabled = true;
            status.textContent = "Zapisywanie nazwy...";

            try {

                // Wysyłanie nazwy do bazy danych

                const { error } = await db
                    .from("participants")
                    .insert({
                        name: nazwa
                    });

                if (error) {
                    throw error;
                }

                // Wyświetlenie gratulacji

                greeting.textContent = "Brawo, " + nazwa + "!";

                status.textContent = "";

                result.hidden = false;
                form.hidden = true;

            } catch (error) {

                console.error("Błąd zapisu:", error);

                status.textContent =
                    "Nie udało się zapisać nazwy. Spróbuj ponownie.";

                submitButton.disabled = false;

            }

        });

    </script>

</body>
</html>
    </script>

</body>
</html>
